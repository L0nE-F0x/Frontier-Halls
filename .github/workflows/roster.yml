# Checks the halls against a live model index once a week and opens a pull
# request when a seat has moved on. It never pushes to main: the rooms carry
# hand-written copy, and a name changing usually means a line of it should too.
name: Roster

on:
  schedule:
    # Monday morning, UTC.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      # Always readable in the run log, whether or not anything changed.
      - name: Read the index
        id: report
        run: |
          set -o pipefail
          npm run --silent roster -- --write 2>&1 | tee roster-report.txt || true
          {
            echo 'body<<REPORT'
            cat roster-report.txt
            echo REPORT
          } >> "$GITHUB_OUTPUT"
          rm roster-report.txt

      - name: Check it still builds
        run: npm run check

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: roster/refresh
          title: "Roster: a seat has moved on"
          commit-message: "Refresh the roster from the model index."
          body: |
            Opened by the weekly roster check.

            ```
            ${{ steps.report.outputs.body }}
            ```

            The seats below moved on their own. Anything listed as *shipped,
            and nobody is standing in it* needs a seat and a line of copy in
            `src/world/halls/`, which this job will not write.
          labels: roster
