# Keeps the halls staffed with the current models, with nobody in the loop.
#
# Every six hours it reads the live model index, moves any seat whose lab has
# shipped a successor, and pushes the change straight to main once it
# typechecks, passes the tests and builds. Netlify deploys main, so a new
# model is standing in its hall within a few hours of being listed.
#
# It only pushes when a seat actually moved, so a quiet day leaves no trace in
# the history. Everything that could make it wrong makes it stop instead, and
# a stopped run fails loudly, which GitHub emails about:
#
#   - the index is unreachable, suspiciously small, or has stopped changing;
#   - more seats moved at once than a release day explains (rerun this by hand
#     with "force" ticked once you have read the moves in the log);
#   - the moved roster does not typecheck, test or build.
#
# It used to open a pull request instead. That needed a person to merge it,
# and the repository does not let Actions open pull requests anyway.
name: Roster

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Apply the moves even past the circuit breaker
        type: boolean
        default: false

permissions:
  contents: write

# Two runs racing each other to push the same move would only make noise.
concurrency:
  group: roster
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Move the seats
        run: npm run --silent roster -- --write --commit-message="$RUNNER_TEMP/roster-commit.txt" ${{ inputs.force && '--force' || '' }}

      - name: Did anything move?
        id: moved
        run: |
          if git diff --quiet -- src/world/roster.ts; then
            echo "roster=no" >> "$GITHUB_OUTPUT"
          else
            echo "roster=yes" >> "$GITHUB_OUTPUT"
            git diff -- src/world/roster.ts
          fi

      - name: Check it still builds
        if: steps.moved.outputs.roster == 'yes'
        run: |
          npm run check
          npm run build

      - name: Ship it
        if: steps.moved.outputs.roster == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world/roster.ts
          git commit --file "$RUNNER_TEMP/roster-commit.txt"
          # Somebody may have pushed while this ran. The roster is its own
          # file, so replaying the one commit on top is safe; a conflict fails
          # the run rather than guessing.
          git pull --rebase origin main
          git push origin HEAD:main
